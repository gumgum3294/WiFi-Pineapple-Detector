
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pineapple Detector</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Inter', sans-serif;
    background: #050505;
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 20px;
}

/* Background */
body::before {
    content: "";
    position: fixed;
    width: 500px;
    height: 500px;
    background: #00ffc3;
    opacity: 0.08;
    filter: blur(150px);
    border-radius: 50%;
    top: -200px;
    left: -150px;
    pointer-events: none;
}

body::after {
    content: "";
    position: fixed;
    width: 400px;
    height: 400px;
    background: #007bff;
    opacity: 0.06;
    filter: blur(150px);
    border-radius: 50%;
    bottom: -200px;
    right: -100px;
    pointer-events: none;
}

/* Grid */
.grid {
    position: fixed;
    inset: 0;
    background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size: 45px 45px;
    pointer-events: none;
}

/* Main container */
.container {
    width: 100%;
    max-width: 420px;
    position: relative;
    padding: 35px;
    border-radius: 24px;
    background: rgba(18, 18, 18, 0.72);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    border: 1px solid rgba(255,255,255,.09);
    box-shadow:
        0 25px 80px rgba(0,0,0,.7),
        inset 0 1px 0 rgba(255,255,255,.06);
    animation: appear .7s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Header */
.header {
    text-align: center;
    margin-bottom: 32px;
}

.logo {
    width: 65px;
    height: 65px;
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 29px;
    border-radius: 19px;
    background: rgba(0,255,195,.08);
    border: 1px solid rgba(0,255,195,.2);
    box-shadow: 0 0 30px rgba(0,255,195,.08);
}

h1 {
    font-size: 25px;
    font-weight: 800;
    letter-spacing: -1px;
    margin-bottom: 9px;
}

h1 span {
    color: #00ffc3;
}

.subtitle {
    font-size: 12px;
    color: #777;
    line-height: 1.6;
}

/* Status */
.status {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin: 22px 0;
    color: #888;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
}

.status-dot {
    width: 7px;
    height: 7px;
    background: #00ffc3;
    border-radius: 50%;
    box-shadow: 0 0 12px #00ffc3;
}

/* Input */
.input-label {
    display: block;
    color: #aaa;
    font-size: 11px;
    font-weight: 600;
    margin-bottom: 10px;
    letter-spacing: .7px;
    text-transform: uppercase;
}

.input-wrapper {
    position: relative;
    margin-bottom: 15px;
}

input {
    width: 100%;
    height: 52px;
    padding: 0 16px;
    border-radius: 12px;
    outline: none;
    background: rgba(255,255,255,.035);
    border: 1px solid rgba(255,255,255,.09);
    color: white;
    font-family: inherit;
    font-size: 13px;
    transition: .25s;
}

input:focus {
    border-color: rgba(0,255,195,.6);
    box-shadow: 0 0 0 3px rgba(0,255,195,.07);
}

input::placeholder {
    color: #555;
}

/* Buttons */
button {
    width: 100%;
    height: 49px;
    border-radius: 12px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: .25s;
}

.primary {
    background: #00ffc3;
    color: #050505;
    border: none;
    box-shadow: 0 5px 25px rgba(0,255,195,.12);
}

.primary:hover {
    background: #65ffdb;
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(0,255,195,.2);
}

.secondary {
    background: rgba(255,255,255,.045);
    border: 1px solid rgba(255,255,255,.1);
    color: #ddd;
    margin-bottom: 12px;
}

.secondary:hover {
    background: rgba(255,255,255,.09);
    border-color: rgba(255,255,255,.2);
}

button:active {
    transform: scale(.98);
}

/* Result */
#result {
    margin-top: 20px;
    min-height: 55px;
    padding: 15px;
    border-radius: 12px;
    background: rgba(255,255,255,.025);
    border: 1px solid rgba(255,255,255,.06);
    font-size: 12px;
    line-height: 1.8;
    color: #999;
    text-align: center;
    overflow-wrap: anywhere;
}

.pineapple {
    color: #ff6565;
    font-weight: 700;
}

.not-pineapple {
    color: #00ffc3;
    font-weight: 700;
}

#result small {
    color: #777;
}

/* Footer */
.footer {
    text-align: center;
    margin-top: 24px;
    font-size: 10px;
    color: #555;
    letter-spacing: .5px;
}

@media(max-width: 480px) {
    .container {
        padding: 27px 22px;
    }

    h1 {
        font-size: 23px;
    }
}
</style>
</head>

<body>

<div class="grid"></div>

<div class="container">

    <div class="header">
        <div class="logo">🍍</div>
        <h1>Pineapple <span>Detector</span></h1>
        <p class="subtitle">
            Network identification and IP information dashboard.
        </p>
    </div>

    <div class="status">
        <span class="status-dot"></span>
        Detection interface online
    </div>

    <label class="input-label">Target IP Address</label>

    <div class="input-wrapper">
        <input
            type="text"
            id="ipInput"
            placeholder="Enter an IP address..."
            autocomplete="off"
        >
    </div>

    <button class="secondary" onclick="detectCurrentIP()">
        ◉ &nbsp; Detect My Current IP
    </button>

    <button class="primary" onclick="detectPineapple()">
        Scan IP Address &nbsp; →
    </button>

    <div id="result">
        Awaiting IP address...
    </div>

    <div class="footer">
        PINEAPPLE DETECTOR &nbsp; • &nbsp; NETWORK TOOLS
    </div>

</div>

<script>
async function detectPineapple() {
    const ip = document.getElementById('ipInput').value.trim();
    const resultDiv = document.getElementById('result');

    if (!ip) {
        resultDiv.innerHTML = '⚠️ Please enter an IP address.';
        return;
    }

    // Basic IPv4 validation
    const ipRegex = /^(?:(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.){3}(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)$/;

    if (!ipRegex.test(ip)) {
        resultDiv.innerHTML = '⚠️ Please enter a valid IPv4 address.';
        return;
    }

    resultDiv.innerHTML = '⏳ Retrieving network information...';

    try {
        const response = await fetch(
            `https://ipinfo.io/${encodeURIComponent(ip)}/json`
        );

        if (!response.ok) {
            throw new Error('API request failed');
        }

        const data = await response.json();

        if (data.error) {
            throw new Error('Unable to retrieve IP information');
        }

        if (data.org && data.org.includes("Evil Machines")) {
            resultDiv.innerHTML = `
                <span class="pineapple">
                    ⚠ WiFi Pineapple Indicator Found
                </span>
                <br>
                <small>Organization: ${escapeHTML(data.org)}</small>
            `;
        } else {
            resultDiv.innerHTML = `
                <span class="not-pineapple">
                    ✓ No Known Indicator Found
                </span>
                <br>
                <small>Organization: ${escapeHTML(data.org || 'Unknown')}</small>
                <br>
                <small>IP: ${escapeHTML(ip)}</small>
                <br><br>
                <small>Device type cannot be confirmed using IP information alone.</small>
            `;
        }

    } catch (error) {
        resultDiv.innerHTML = `
            <span class="pineapple">✕ Detection Request Failed</span>
            <br>
            <small>${escapeHTML(error.message)}</small>
        `;
    }
}

async function detectCurrentIP() {
    const resultDiv = document.getElementById('result');

    resultDiv.innerHTML = '⏳ Getting your public IP...';

    try {
        const response = await fetch(
            'https://api.ipify.org?format=json'
        );

        if (!response.ok) throw new Error('IP lookup failed');

        const data = await response.json();

        document.getElementById('ipInput').value = data.ip;

        await detectPineapple();

    } catch (error) {
        resultDiv.innerHTML = `
            <span class="pineapple">✕ Could not retrieve your IP.</span>
        `;
    }
}

function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
    })[char]);
}

document.getElementById('ipInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') detectPineapple();
});
</script>

</body>
</html>
